<!DOCTYPE html>
<html>
<head>
  <title>The Style Edit</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    p {
      text-align: center;
      color: #555;
    }

    .product {
      border: 1px solid #eee;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      background: black;
      color: white;
      padding: 10px 15px;
      text-decoration: none;
      margin-top: 10px;
      border-radius: 5px;
    }

    .btn:hover {
      background: #333;
    }

    footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>The Style Edit</h1>
  <p>Women Fashion • Bags • Shoes • Jewelry</p>

  <div class="product">
    <h2>Featured Deal</h2>
    <p>Trendy fashion pick for modern women</p>
    <a class="btn" href="https://amzn.to/4ojDgLj" target="_blank">
      Buy on Amazon
    </a>
  </div>

  <footer>
    © 2026 The Style Edit
  </footer>

</div>

</body>
</html>
